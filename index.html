<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <meta
            name="description"
            content="小小作品，轻松时光。海风吹过的小岛，云海之间的城堡，欢迎来到 allurx 的 Playground。"
        />
        <title>Playground · allurx</title>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="stylesheet" href="./src/styles.css" />
        <link rel="canonical" href="https://play.allurx.io/" />
    </head>
    <body>
        <a class="skip-link" href="#main">跳到作品</a>
        <header class="site-header shell">
            <a class="brand" href="./" aria-label="Playground 首页">Playground<span aria-hidden="true">.</span></a>
            <a class="author-link" href="https://allurx.io/"
                >allurx <span class="arrow-mark" aria-hidden="true"></span
            ></a>
        </header>

        <main id="main" class="shell" tabindex="-1">
            <h1>小小作品，轻松时光。</h1>
            <section class="gallery" aria-label="作品">
                <article class="work work-bay">
                    <a
                        class="work-link"
                        href="./tiny-bay/"
                        aria-labelledby="tiny-bay-title"
                        aria-describedby="tiny-bay-description"
                    >
                        <div class="work-copy">
                            <h2 id="tiny-bay-title">小小海湾</h2>
                            <p id="tiny-bay-description">海风吹过，不赶时间。</p>
                        </div>
                        <div class="work-visual">
                            <img
                                class="work-art"
                                src="./illustrations/tiny-bay.webp"
                                width="1448"
                                height="1086"
                                alt=""
                                fetchpriority="high"
                                decoding="async"
                            />
                        </div>
                        <span class="work-arrow" aria-hidden="true"><span class="arrow-mark"></span></span>
                    </a>
                </article>
                <article class="work work-sky">
                    <a
                        class="work-link"
                        href="./sky-island/"
                        aria-labelledby="sky-island-title"
                        aria-describedby="sky-island-description"
                    >
                        <div class="work-copy">
                            <h2 id="sky-island-title">云上城堡</h2>
                            <p id="sky-island-description">风车转动，云朵经过。</p>
                        </div>
                        <div class="work-visual">
                            <img
                                class="work-art"
                                src="./illustrations/sky-island.webp"
                                width="1448"
                                height="1086"
                                alt=""
                                loading="lazy"
                                decoding="async"
                            />
                        </div>
                        <span class="work-arrow" aria-hidden="true"><span class="arrow-mark"></span></span>
                    </a>
                </article>
            </section>
        </main>

        <footer class="site-footer shell">
            <p>© 2026 allurx</p>
        </footer>
    </body>
</html>
