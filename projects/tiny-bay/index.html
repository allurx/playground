<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#d2e5e3" />
        <meta name="description" content="小小海湾：一座可以拨水、唤鲸、切换天气的极地微缩景观。" />
        <meta name="color-scheme" content="light" />
        <title>小小海湾 · Allurx Playground</title>
        <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg?inline" />
        <link rel="stylesheet" href="./src/styles.css" />
        <script type="module" src="./src/app.ts"></script>
    </head>
    <body>
        <canvas id="stage" tabindex="0" aria-label="小小海湾互动场景" aria-describedby="keyboardHelp" inert></canvas>
        <p id="keyboardHelp" class="sr-only">方向键环视，加减键缩放，W 拨水，空格唤鲸，P 暂停，R 复位视角。</p>

        <header class="layer site-header control-header">
            <a
                class="back-link icon-button live"
                id="playgroundLink"
                href="../"
                aria-label="返回作品集"
                title="返回作品集"
                ><span class="icon" data-icon="back" aria-hidden="true"></span
            ></a>
            <h1>小小海湾</h1>
        </header>
        <div class="sr-only" role="status">
            <i id="dot" aria-hidden="true"></i><span id="statusText">小岛正在苏醒</span>
        </div>

        <aside class="layer panel control-corner" id="panel" aria-label="海湾设置" inert>
            <button
                class="sheetbar icon-button settings-button live"
                id="sheetbar"
                type="button"
                aria-label="海湾设置"
                aria-expanded="false"
                aria-controls="panelContent"
                title="海湾设置"
            >
                <span class="icon settings-icon" data-icon="settings" aria-hidden="true"></span>
                <span class="icon close-icon" data-icon="close" aria-hidden="true"></span>
            </button>
            <div id="panelContent" class="control-panel" inert>
                <div class="panel-scroll">
                    <section class="weather-section" aria-label="天气">
                        <div class="swatches">
                            <button class="swatch" type="button" data-palette="lagoon" aria-pressed="true">
                                <i class="weather-orb daylight" aria-hidden="true"></i><span>晴日</span>
                            </button>
                            <button class="swatch" type="button" data-palette="raspberry" aria-pressed="false">
                                <i class="weather-orb snowfall" aria-hidden="true"></i><span>飘雪</span>
                            </button>
                            <button class="swatch" type="button" data-palette="lime" aria-pressed="false">
                                <i class="weather-orb aurora" aria-hidden="true"></i><span>极光</span>
                            </button>
                            <button class="swatch" type="button" data-palette="sunset" aria-pressed="false">
                                <i class="weather-orb sunset" aria-hidden="true"></i><span>落日</span>
                            </button>
                        </div>
                        <button class="storm-button" id="dropCoconut" type="button" aria-pressed="false">风雪</button>
                    </section>
                    <details class="parameters">
                        <summary>微调<span aria-hidden="true">+</span></summary>
                        <div class="sliders">
                            <div class="slider">
                                <label for="wind"><span>风力</span><output id="windOut">18</output></label
                                ><input type="range" id="wind" min="0" max="100" value="18" />
                            </div>
                            <div class="slider">
                                <label for="damp"><span>平静速度</span><output id="dampOut">30</output></label
                                ><input type="range" id="damp" min="0" max="100" value="30" />
                            </div>
                            <div class="slider">
                                <label for="tide"><span>潮位</span><output id="tideOut">0 厘米</output></label
                                ><input type="range" id="tide" min="-100" max="100" value="0" />
                            </div>
                            <div class="slider">
                                <label for="clarity"><span>通透度</span><output id="clarityOut">60</output></label
                                ><input type="range" id="clarity" min="0" max="100" value="60" />
                            </div>
                            <div class="slider">
                                <label for="light"><span>光照</span><output id="lightOut">65</output></label
                                ><input type="range" id="light" min="0" max="100" value="65" />
                            </div>
                            <div class="slider">
                                <label for="firm"><span>回弹</span><output id="firmOut">50</output></label
                                ><input type="range" id="firm" min="0" max="100" value="50" />
                            </div>
                        </div>
                    </details>
                </div>
                <div class="panel-footer">
                    <button id="reset" type="button">重置</button
                    ><button id="resetView" type="button">
                        <span class="icon" data-icon="reset" aria-hidden="true"></span>复位视角
                    </button>
                    <a
                        class="release-link"
                        href="https://github.com/allurx/playground/releases"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="版本与下载（新窗口）"
                        ><span class="icon" data-icon="download" aria-hidden="true"></span>版本与下载</a
                    >
                </div>
            </div>
        </aside>

        <footer class="layer bottom-bar control-dock">
            <div class="action-bar control-toolbar live" role="group" aria-label="海湾工具">
                <button id="soundToggle" class="icon-button" type="button" aria-pressed="false" title="声音">
                    <span class="icon" data-icon="sound" aria-hidden="true"></span
                    ><span id="soundLabel" class="sr-only">声音</span
                    ><span class="sound-indicator" aria-hidden="true"></span>
                </button>
                <button
                    id="postcardButton"
                    class="icon-button"
                    type="button"
                    aria-haspopup="dialog"
                    aria-controls="postcardDialog"
                    title="拍照"
                >
                    <span class="icon" data-icon="camera" aria-hidden="true"></span><span class="sr-only">拍照</span>
                </button>
                <button
                    id="pause"
                    class="icon-button playback-button"
                    type="button"
                    aria-pressed="false"
                    aria-label="暂停"
                    title="暂停"
                >
                    <span class="icon" data-icon="pause" aria-hidden="true"></span
                    ><span class="icon" data-icon="play" aria-hidden="true"></span
                    ><span id="pauseLabel" class="sr-only">暂停</span>
                </button>
                <button id="dropPebble" class="icon-button" type="button" title="唤鲸">
                    <span class="icon" data-icon="whale" aria-hidden="true"></span><span class="sr-only">唤鲸</span>
                </button>
            </div>
        </footer>

        <div hidden><b id="meter"></b><span id="seaReactions">海豹在岸 · 小船平稳</span></div>

        <dialog id="postcardDialog" class="postcard-dialog" aria-labelledby="postcardTitle">
            <div class="dialog-heading">
                <h2 id="postcardTitle">这一刻</h2>
                <button class="icon-button" type="button" data-close-dialog="postcardDialog" aria-label="关闭照片">
                    <span class="icon" data-icon="close" aria-hidden="true"></span>
                </button>
            </div>
            <div class="postcard-content" id="postcardContent">
                <div class="postcard-preview">
                    <canvas id="postcardCanvas" width="1400" height="880" aria-label="照片预览"></canvas>
                </div>
                <label class="postcard-label" for="postcardMessage">留言<span>可选 · 40 字以内</span></label>
                <textarea id="postcardMessage" rows="2" maxlength="40" placeholder="留给此刻的话"></textarea>
            </div>
            <div class="postcard-footer">
                <div class="postcard-actions">
                    <button class="secondary-button" id="postcardRefresh" type="button">重拍</button
                    ><button class="primary-button" id="postcardDownload" type="button">
                        <span class="icon" data-icon="download" aria-hidden="true"></span>保存照片
                    </button>
                </div>
                <p id="postcardStatus" class="dialog-footnote" role="status">图片仅保存到本机。</p>
            </div>
        </dialog>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="fallback" role="alert">
            <div>
                <span class="fallback-icon icon" data-icon="mountains" aria-hidden="true"></span>
                <h2 id="fallbackTitle" tabindex="-1">海湾暂时无法打开</h2>
                <p id="fallbackText">此场景需要支持 WebGPU 的浏览器，并开启硬件加速。</p>
                <a
                    class="release-link error-download"
                    href="https://github.com/allurx/playground/releases"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="版本与下载（新窗口）"
                    ><span class="icon" data-icon="download" aria-hidden="true"></span>版本与下载</a
                >
            </div>
        </div>
    </body>
</html>
