name: Release

run-name: Release ${{ github.ref_name }}

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

concurrency:
    group: playground-release
    queue: max

jobs:
    build:
        name: Build release assets
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            tag_object: ${{ steps.release_tag.outputs.tag_object }}
            artifact_id: ${{ steps.release_assets.outputs.artifact-id }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate release tag
              id: release_tag
              shell: bash
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "::error::Release tag must use the stable SemVer form vMAJOR.MINOR.PATCH"
                      exit 1
                  fi

                  tag_ref="refs/tags/$TAG_NAME"
                  if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
                      echo "::error::Release tag must be annotated"
                      exit 1
                  fi

                  tag_commit="$(git rev-parse "$tag_ref^{commit}")"
                  if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
                      echo "::error::The checked-out commit does not match the release tag"
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
                      echo "::error::Release tag commit must be contained in main"
                      exit 1
                  fi
                  echo "tag_object=$(git rev-parse "$tag_ref")" >> "$GITHUB_OUTPUT"

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify project
              run: npm run verify

            - name: Package portable works
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: node scripts/package-release.ts "$TAG_NAME"

            - name: Upload release assets
              id: release_assets
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-assets-${{ github.ref_name }}
                  path: |
                      dist/release/*.html
                      dist/release/SHA256SUMS.txt
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish GitHub Release
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Download verified release assets
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  artifact-ids: ${{ needs.build.outputs.artifact_id }}
                  path: release-assets
                  merge-multiple: true

            - name: Publish GitHub Release
              shell: bash
              env:
                  EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
                  if [[ "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
                      echo "::error::Release tag changed after the build started"
                      exit 1
                  fi

                  cd release-assets
                  sha256sum --strict --check SHA256SUMS.txt
                  gh release create "$TAG_NAME" ./*.html SHA256SUMS.txt \
                      --repo "$GITHUB_REPOSITORY" \
                      --verify-tag \
                      --generate-notes \
                      --title "$TAG_NAME"
