name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        uses: allurx/allurx-build/.github/workflows/cloudflare-static-site.yml@79ef08b3ae6b3b124bb9208199df562fd8107353 # workflows-v2.0.0
        with:
            asset-directory: dist/
            production-url: https://play.allurx.io
        secrets: inherit
