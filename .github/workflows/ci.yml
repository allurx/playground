name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        uses: allurx/web-foundation/.github/workflows/static-site.yml@main
        with:
            asset-directory: dist/
            production-url: https://play.allurx.io
        secrets: inherit

    dependabot-merge:
        needs: site
        permissions:
            contents: write
            pull-requests: write
            actions: write
        uses: allurx/web-foundation/.github/workflows/dependabot-site.yml@main
